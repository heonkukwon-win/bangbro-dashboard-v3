const S = `
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --nv:#0D1B2E;--nv2:#152236;--nv3:#1E3350;--nv4:#243655;
    --go:#C9943A;--gL:#F0C060;

  .ldot{width:7px;height:7px;background:var(--re);border-radius:50%;display:inline-block;
        margin-right:5px;animation:pulse 2s infinite;}

  .tab{padding:8px 16px;border-radius:8px 8px 0 0;font-size:12px;font-weight:700;cursor:pointer;
       transition:all .2s;border:1px solid transparent;border-bottom:none;
       color:var(--gY);background:transparent;font-family:'Noto Sans KR',sans-serif;}
  .tab.on{background:var(--nv3);color:var(--gL);border-color:var(--bd);}
  .tab:hover:not(.on){color:var(--wh);background:rgba(255,255,255,.05);}

  .cb.ck{background:var(--gr);border-color:var(--gr);}

  .ib{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.3);
      border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:12px;line-height:1.6;color:#93C5FD;}
  .pb{background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.3);
      border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:12px;line-height:1.8;color:#C4B5FD;}
  .mg{margin-bottom:16px;}
  .fb{display:flex;justify-content:space-between;align-items:center;}
  .sm{font-size:11px;color:var(--gY);}
  /* 게이지 공통 */
  .gauge-wrap{position:relative;height:58px;margin:16px 0 10px;}
  .gauge-track{position:absolute;bottom:0;left:0;right:0;height:14px;border-radius:7px;opacity:.35;}
  .gauge-fill{position:absolute;bottom:0;left:0;height:14px;border-radius:7px;transition:width .8s cubic-bezier(.4,0,.2,1);}
  .gauge-line{position:absolute;bottom:-4px;width:2px;height:22px;background:rgba(255,255,255,.9);border-radius:1px;transform:translateX(-50%);}
  .gauge-line-lbl{position:absolute;top:-20px;transform:translateX(-50%);font-family:'IBM Plex Mono',monospace;font-size:9px;color:rgba(255,255,255,.7);white-space:nowrap;}
  .gauge-pin{position:absolute;bottom:10px;width:3px;height:28px;border-radius:2px;transform:translateX(-50%);box-shadow:0 0 8px rgba(255,255,255,.5);}
  .gauge-pin-lbl{position:absolute;top:-30px;transform:translateX(-50%);font-family:'Bebas Neue',cursive;font-size:17px;white-space:nowrap;}
  .gauge-ticks{position:absolute;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--gY);}
  .gauge-status{border-radius:8px;padding:10px 14px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px;margin-top:10px;border:1px solid;}
  .yh-row{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid var(--bd);}
  .yh-row:last-child{border-bottom:none;}
  .yh-date{font-family:'IBM Plex Mono',monospace;font-size:9px;color:var(--gY);min-width:50px;}
  .yh-bw{flex:1;height:6px;background:rgba(255,255,255,.07);border-radius:3px;overflow:hidden;}
  .yh-bf{height:100%;border-radius:3px;}
  .yh-val{font-family:'IBM Plex Mono',monospace;font-size:10px;min-width:40px;text-align:right;}
  .prog-seg{height:5px;border-radius:3px;margin-bottom:3px;}
`;

const fmtW = n => n>=1e8?`${(n/1e8).toFixed(1)}억`:n>=1e4?`${(n/1e4).toFixed(0)}만`:`${n}`;

// ── 기술지표 미니 게이지 컴포넌트 ─────────────────────────────
function TechCard({ title, sub, current, buyLevel, hotLevel, min, max, unit='', history, flip=false, tariffRef=null, tariffLabel='관세쇼크 저점' }) {
  // flip=true → 낮을수록 매수 (SPS, SPB, RSI)
  // flip=false → 높을수록 매수 (PCR: 1.0 이상이 역발상 매수)
  const isBuy   = flip ? current <= buyLevel  : current >= buyLevel;
  const isHot   = flip ? current >= hotLevel  : current <= hotLevel;
  const pct     = Math.min(100, Math.max(0, ((current - min) / (max - min)) * 100)).toFixed(1);
  const buyPct  = Math.min(100, Math.max(0, ((buyLevel - min) / (max - min)) * 100)).toFixed(1);
  const hotPct  = hotLevel != null ? Math.min(100, Math.max(0, ((hotLevel - min) / (max - min)) * 100)).toFixed(1) : null;
  const tariffPct = tariffRef != null ? Math.min(100, Math.max(0, ((tariffRef - min) / (max - min)) * 100)).toFixed(1) : null;

  // 현재값 vs 관세쇼크 비교
  const tariffDist = tariffRef != null ? Math.abs(current - tariffRef) : null;
  const tariffProg = tariffRef != null
    ? flip
      ? Math.round((1 - (current - tariffRef) / (buyLevel - tariffRef)) * 100)  // 얼마나 저점에 가까운지
      : Math.round(((current - buyLevel) / (tariffRef - buyLevel)) * 100)
    : null;

  const statusColor = isBuy ? 'var(--gr)' : isHot ? 'var(--re)' : '#EAB308';
  const statusBg    = isBuy ? 'rgba(34,197,94,.1)' : isHot ? 'rgba(229,62,62,.1)' : 'rgba(234,179,8,.1)';
  const statusBd    = isBuy ? 'rgba(34,197,94,.3)' : isHot ? 'rgba(229,62,62,.3)' : 'rgba(234,179,8,.3)';
  const statusTxt   = isBuy ? '✅ 매수 신호!' : isHot ? '🔴 과열 경계' : '🟡 중립 관망';
  const statusLbl   = isBuy ? 'bg' : isHot ? 'br' : 'by';

  const fmt = v => unit === '%' ? `${v.toFixed(1)}%` : unit === 'x' ? `${v.toFixed(2)}x` : v >= 0 ? `+${v.toFixed(0)}` : `${v.toFixed(0)}`;

  return (
    <div className="card mg">
      <div className="ct">{title}</div>
      <div className="fb" style={{marginBottom:6}}>
        <div>
          <div className="bn" style={{color:statusColor, fontSize:42}}>{fmt(current)}</div>
          <div className="sm" style={{marginTop:3}}>{sub}</div>
        </div>
        <div style={{textAlign:'right'}}>
          <span className={`bdg ${statusLbl}`} style={{fontSize:11,padding:'4px 12px'}}>{statusTxt}</span>
          <div className="sm" style={{marginTop:5}}>
            매수기준: {unit==='x'?`${buyLevel}x`:`${buyLevel}`}{unit==='%'?'%':''}
            {hotLevel != null && ` / 과열: ${hotLevel}${unit==='%'?'%':''}`}
          </div>
        </div>
      </div>

      {/* 3구간 트랙 게이지 */}
      <div style={{position:'relative',height:52,margin:'14px 0 8px'}}>
        {/* 배경 트랙 */}
        <div style={{position:'absolute',bottom:0,left:0,right:0,height:12,borderRadius:6,
          background: flip
            ? `linear-gradient(90deg, #22C55E 0%, #22C55E ${buyPct}%, #EAB308 ${buyPct}%, #EAB308 ${hotPct ?? 80}%, #EF4444 ${hotPct ?? 80}%, #EF4444 100%)`
            : `linear-gradient(90deg, #EF4444 0%, #EF4444 ${buyPct}%, #EAB308 ${buyPct}%, #EAB308 ${hotPct ?? 80}%, #22C55E ${hotPct ?? 80}%, #22C55E 100%)`,
          opacity:0.3}}/>
        {/* 채워지는 바 */}
        <div style={{position:'absolute',bottom:0,left:0,height:12,borderRadius:6,
          width:`${pct}%`,background:statusColor,transition:'width .8s',opacity:0.85}}/>
        {/* 매수 기준선 */}
        <div style={{position:'absolute',bottom:-3,left:`${buyPct}%`,width:2,height:18,
          background:'#22C55E',borderRadius:1,transform:'translateX(-50%)'}}>
          <div style={{position:'absolute',top:-18,transform:'translateX(-50%)',
            fontFamily:'IBM Plex Mono',fontSize:8,color:'#22C55E',whiteSpace:'nowrap'}}>
            매수{unit==='x'?` ${buyLevel}x`:` ${buyLevel}`}
          </div>
        </div>
        {/* 과열 기준선 */}
        {hotLevel != null && (
          <div style={{position:'absolute',bottom:-3,left:`${hotPct}%`,width:2,height:18,
            background:'#EF4444',borderRadius:1,transform:'translateX(-50%)'}}>
            <div style={{position:'absolute',top:-18,transform:'translateX(-50%)',
              fontFamily:'IBM Plex Mono',fontSize:8,color:'#EF4444',whiteSpace:'nowrap'}}>
              과열{unit==='x'?` ${hotLevel}x`:` ${hotLevel}`}
            </div>
          </div>
        )}
        {/* 현재값 핀 */}
        <div style={{position:'absolute',bottom:8,left:`${pct}%`,width:3,height:26,
          borderRadius:2,background:statusColor,transform:'translateX(-50%)',
          boxShadow:`0 0 8px ${statusColor}80`,transition:'left .8s'}}/>
        {/* 관세쇼크 저점 기준선 */}
        {tariffPct != null && (
          <div style={{position:'absolute',bottom:-3,left:`${tariffPct}%`,width:2,height:18,
            background:'#A78BFA',borderRadius:1,transform:'translateX(-50%)',opacity:0.9}}>
            <div style={{position:'absolute',top:-18,transform:'translateX(-50%)',
              fontFamily:'IBM Plex Mono',fontSize:8,color:'#A78BFA',whiteSpace:'nowrap'}}>
              📌관세쇼크
            </div>
          </div>
        )}
      </div>

      {/* 상태 배너 */}
      <div style={{borderRadius:8,padding:'8px 12px',fontSize:11,fontWeight:700,
        background:statusBg,border:`1px solid ${statusBd}`,color:statusColor,marginBottom:10}}>
        {statusTxt} — 현재 {fmt(current)}
        {isBuy && ' 📍 매수 신호 구간'}
        {isHot && ' ⚠️ 과열 — 신규 진입 자제'}
      </div>

      {/* 관세쇼크 비교 박스 */}
      {tariffRef != null && (
        <div style={{background:'rgba(167,139,250,.08)',border:'1px solid rgba(167,139,250,.25)',
          borderRadius:8,padding:'9px 12px',marginBottom:12,fontSize:11}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',flexWrap:'wrap',gap:6}}>
            <div style={{display:'flex',alignItems:'center',gap:6}}>
              <span style={{color:'#A78BFA',fontWeight:700,fontSize:12}}>📌 2025 관세쇼크 {tariffLabel}</span>
              <span style={{fontFamily:'IBM Plex Mono',fontWeight:700,fontSize:14,color:'#C4B5FD'}}>
                {fmt(tariffRef)}
              </span>
            </div>
            <div style={{display:'flex',gap:6,alignItems:'center'}}>
              {/* 현재 vs 저점 진행도 */}
              {(() => {
                const gap = Math.abs(current - tariffRef).toFixed(unit==='%'||unit==='x'?2:0);
                const isCloser = flip ? current > tariffRef : current < tariffRef;
                return (
                  <span style={{fontSize:10,color:isCloser?'#86EFAC':'#FCA5A5',fontFamily:'IBM Plex Mono'}}>
                    {isCloser ? `저점까지 ${gap}${unit==='%'?'%':unit==='x'?'x':''} 남음` : `저점 ${gap}${unit==='%'?'%':unit==='x'?'x':''} 초과`}
                  </span>
                );
              })()}
            </div>
          </div>
          {/* 현재위치 진행바 */}
          {(() => {
            const totalRange = Math.abs(tariffRef - (flip ? hotLevel || max : hotLevel || min));
            const curRange   = Math.abs(current - (flip ? hotLevel || max : hotLevel || min));
            const prog = Math.min(100, Math.round(curRange / totalRange * 100));
            return (
              <div style={{marginTop:6}}>
                <div style={{display:'flex',justifyContent:'space-between',fontSize:9,color:'rgba(167,139,250,.7)',marginBottom:3,fontFamily:'IBM Plex Mono'}}>
                  <span>{flip ? '과열(탐욕)' : '매수권'}</span>
                  <span>현재 {Math.round(prog)}% 진행</span>
                  <span>{flip ? '매수(공포)' : '과열권'}</span>
                </div>
                <div style={{height:5,borderRadius:3,background:'rgba(167,139,250,.15)',overflow:'hidden'}}>
                  <div style={{height:'100%',width:`${prog}%`,background:'linear-gradient(90deg,rgba(167,139,250,.3),#A78BFA)',borderRadius:3,transition:'width .6s'}}/>
                </div>
              </div>
            );
          })()}
        </div>
      )}

      {/* 최근 추이 */}
      <div style={{fontSize:10,color:'var(--gY)',marginBottom:5,fontFamily:'IBM Plex Mono',letterSpacing:1}}>최근 추이</div>
      {history.map((h, i) => {
        const hBuy = flip ? h.val <= buyLevel : h.val >= buyLevel;
        const hHot = flip ? (hotLevel != null && h.val >= hotLevel) : (hotLevel != null && h.val <= hotLevel);
        const hColor = hBuy ? 'var(--gr)' : hHot ? 'var(--re)' : '#EAB308';
        const hPct = Math.abs(h.val) / Math.max(...history.map(x => Math.abs(x.val))) * 100;
        return (
          <div className="yh-row" key={i}>
            <span className="yh-date">{h.date}</span>
            <div className="yh-bw"><div className="yh-bf" style={{width:`${hPct.toFixed(0)}%`, background:hColor}}/></div>
            <span className="yh-val" style={{color:hColor}}>{fmt(h.val)}</span>
          </div>
        );
      })}
    </div>
  );
}

// ── 공통 게이지 컴포넌트 ──────────────────────────────────────
function Gauge({ title, current, threshold, min, max, ticks, unit='%', historyData, interpret }) {
  const isRisk = current >= threshold;
  const pct = ((current - min) / (max - min) * 100).toFixed(1);
  const thPct = ((threshold - min) / (max - min) * 100).toFixed(1);
  const pinColor = isRisk ? '#EF4444' : '#22C55E';
  const fillBg = isRisk
    ? 'linear-gradient(90deg,#22C55E,#EAB308 40%,#EF4444)'
    : 'linear-gradient(90deg,#22C55E,#4ADE80)';
  const trackBg = `linear-gradient(90deg,#22C55E 0%,#22C55E ${thPct}%,#EAB308 ${thPct}%,#EAB308 ${+thPct+5}%,#EF4444 ${+thPct+5}%,#EF4444 100%)`;
  const maxH = Math.max(...historyData.map(h=>h.val));
  const diff = (current - threshold).toFixed(unit==='%'?3:1);

  return (
    <div className="card mg">
      <div className="ct">{title}</div>
      <div className="fb" style={{marginBottom:4}}>
        <div>
          <div className={`bn ${isRisk?'re':'gr'}`}>
            {unit==='%' ? `${current.toFixed(3)}%` : `$${current.toFixed(1)}`}
          </div>
          <div className="sm" style={{marginTop:3}}>
            기준선 {unit==='%'?`${threshold}%`:`$${threshold}`} 대비&nbsp;
            <span style={{color:isRisk?'var(--re)':'var(--gr)',fontWeight:700}}>
              {isRisk ? `+${diff}${unit==='%'?'%':''}` : `${diff}${unit==='%'?'%':''}`}
            </span>
          </div>
        </div>
        <div style={{textAlign:'right'}}>
          <span className={`bdg ${isRisk?'br':'bg'}`} style={{fontSize:12,padding:'5px 14px'}}>
            {isRisk ? '⚠️ 위험 구간' : '✅ 안정 구간'}
          </span>
          <div className="sm" style={{marginTop:5}}>기준선 {unit==='%'?`${threshold}%`:`$${threshold}`}</div>
        </div>
      </div>

      <div className="gauge-wrap">
        <div className="gauge-ticks">{ticks.map((t,i)=><span key={i}>{t}</span>)}</div>
        <div className="gauge-track" style={{background:trackBg}}/>
        <div className="gauge-fill" style={{width:`${pct}%`,background:fillBg}}/>
        <div className="gauge-line" style={{left:`${thPct}%`}}>
          <div className="gauge-line-lbl" style={{left:'50%'}}>
            {unit==='%'?`${threshold}%`:`$${threshold}`}
          </div>
        </div>
        <div className="gauge-pin" style={{left:`${pct}%`,background:pinColor}}/>
        <div className="gauge-pin-lbl" style={{left:`${pct}%`,color:pinColor}}>
          {unit==='%'?`${current.toFixed(3)}%`:`$${current.toFixed(1)}`}
        </div>
      </div>

      <div className="gauge-status" style={{
        background: isRisk?'rgba(239,68,68,.1)':'rgba(34,197,94,.1)',
        borderColor: isRisk?'rgba(239,68,68,.35)':'rgba(34,197,94,.35)',
        color: isRisk?'#FCA5A5':'#86EFAC'
      }}>
        <span style={{fontSize:16}}>{isRisk?'🔴':'🟢'}</span>
        <div>{isRisk ? interpret.risk(current,threshold) : interpret.safe(current,threshold)}</div>
      </div>

      <div style={{marginTop:12}}>
        <div style={{fontSize:10,color:'var(--gY)',marginBottom:6,fontFamily:'IBM Plex Mono',letterSpacing:1}}>최근 추이</div>
        {historyData.map((h,i)=>{
          const hPct=(h.val/maxH*100).toFixed(0);
          const hRisk=h.val>=threshold;
          return (
            <div className="yh-row" key={i}>
              <span className="yh-date">{h.date}</span>
              <div className="yh-bw"><div className="yh-bf" style={{width:`${hPct}%`,background:hRisk?'var(--re)':'var(--gr)'}}/></div>
              <span className="yh-val" style={{color:hRisk?'var(--re)':'var(--gr)'}}>
                {unit==='%'?`${h.val}%`:`$${h.val}`}
              </span>
            </div>
          );
        })}
      </div>

      <div style={{marginTop:12,display:'grid',gridTemplateColumns:'1fr 1fr',gap:8}}>
        {interpret.boxes.map((b,i)=>(
          <div key={i} style={{background:b.bg,borderRadius:8,padding:'9px 11px',border:`1px solid ${b.c}33`}}>
            <div style={{fontSize:10,fontWeight:700,color:b.c,marginBottom:3}}>{b.label}</div>
            <div style={{fontSize:10,color:'var(--gY)',lineHeight:1.5,whiteSpace:'pre-line'}}>{b.desc}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

// ── 탭2: 시뮬레이터 ────────────────────────────────────────────
function T2() {

              {g.hot && <span className="bdg br" style={{fontSize:9}}>과열: {g.hot}</span>}
            </div>
            <div style={{fontSize:11,color:'var(--gY)',lineHeight:1.7,marginBottom:4}}>{g.desc}</div>
            <div style={{fontFamily:'IBM Plex Mono',fontSize:10,color:
              g.cur.includes('✅')?'var(--gr)':'var(--gY)'}}>{g.cur}</div>

        ))}
